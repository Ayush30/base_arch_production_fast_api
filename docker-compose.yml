x-api: &api
  build: .
  env_file: .env
  environment: &environment
    DATABASE_URL: postgresql+asyncpg://marketplace:marketplace@db:5432/marketplace
    REDIS_URL: redis://redis:6379/0
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    OTLP_ENDPOINT: ${DOCKER_OTLP_ENDPOINT:-http://jaeger:4317}
    JWT_PRIVATE_KEY_PATH: /run/keys/private.pem
    JWT_PUBLIC_KEY_PATH: /run/keys/public.pem
  # Local containers use the host UID so a 0600 private key stays readable without chmod 644.
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  volumes:
    - ./keys:/run/keys:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    restart: "no"
  app:
    <<: *api
    ports: ["127.0.0.1:${APP_PORT:-8000}:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  reservations:
    <<: *api
    command: ["python", "-m", "app.workers.reservations"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  kafka:
    image: apache/kafka:3.9.1
    profiles: ["events"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka_data:/var/lib/kafka/data"]
  outbox:
    <<: *api
    profiles: ["events"]
    environment:
      <<: *environment
      KAFKA_ENABLED: "true"
    command: ["python", "-m", "app.workers.outbox"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["observability"]
    ports: ["127.0.0.1:9090:9090"]
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    profiles: ["observability"]
    ports: ["127.0.0.1:16686:16686", "127.0.0.1:4317:4317"]
volumes:
  postgres_data:
  kafka_data:
