name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://marketplace:marketplace@localhost:5432/marketplace_ci
      TEST_DATABASE_URL: postgresql+asyncpg://marketplace:marketplace@localhost:5432/marketplace_ci
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts alembic
      - run: uv run ruff format --check src tests scripts alembic
      - run: uv run mypy src
      - run: uv run python scripts/check_docs.py
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
