# Local two-replica teaching lab. The direct API remains at 8000, proxy at 8080.
services:
  app2:
    extends:
      file: docker-compose.yml
      service: app
    ports: !reset []
  nginx:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:${PROXY_PORT:-8080}:8080"]
    volumes: ["./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      app:
        condition: service_healthy
      app2:
        condition: service_healthy
